  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

center;justify-content:center;height:40px;padding:0 18px;border-radius:10px;font-size:14px;font-weight:500}\n.row{display:flex;align-items:center;gap:14px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13.5px}\n.badge{display:inline-flex;align-items:center;height:20px;padding:0 7px;border-radius:6px;font-size:9.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:500}\ntable{width:100%;border-collapse:collapse;font-size:12.5px}\nth{text-align:left;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:500;padding:0 10px 7px 0;border-bottom:1px solid var(--line)}\ntd{padding:8px 10px 8px 0;border-bottom:1px solid var(--line);vertical-align:top;color:var(--ink)}\ntd.m{color:var(--muted)}\n.tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px}\n<\u002Fstyle><\u002Fhead><body>\n\n<doc-page margin=\"0.7in\">\n\n<header style=\"display:flex;align-items:flex-start;gap:20px\">\n<div style=\"background:#101C2E;border-radius:12px;padding:14px;display:flex\"><img src=\"6abf1787-882d-44f8-90d7-f361656d2510\" alt=\"WaterGuards\" style=\"width:64px;height:64px;object-fit:contain;display:block\"><\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:6px\">\n<span class=\"eyebrow\">Design overview · August 2026<\u002Fspan>\n<h1>WaterGuards<\u002Fh1>\n<p class=\"lede\">Navy and gold, one clean sans, real surf footage. This is the visual and content system behind the client app and the admin console.<\u002Fp>\n<\u002Fdiv>\n<\u002Fheader>\n<div class=\"rule\"><\u002Fdiv>\n<p style=\"font-size:15px;line-height:23px;font-weight:500\">\"Super clean. No bells &amp; whistles. Simple is key. Navy &amp; gold.\"<\u002Fp>\n<p class=\"meta\" style=\"margin-top:6px\">A navy interface with small gold details — not a gold interface. The footage carries the personality; the UI stays out of its way.<\u002Fp>\n\n<section class=\"sec\">\n<span class=\"eyebrow\">01<\u002Fspan><h2>Colour<\u002Fh2><div class=\"rule\"><\u002Fdiv>\n<h3>Brand<\u002Fh3>\n<div class=\"grid\" style=\"grid-template-columns:repeat(5,1fr)\">\n<div class=\"sw\"><div class=\"chip\" style=\"background:#101C2E\"><\u002Fdiv><span class=\"name\">Primary navy<\u002Fspan><span class=\"meta\">#101C2E<br>Header, nav, body text<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"chip\" style=\"background:#1B263B\"><\u002Fdiv><span class=\"name\">Navy 700<\u002Fspan><span class=\"meta\">#1B263B<br>Raised navy surfaces<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"chip\" style=\"background:#415A77\"><\u002Fdiv><span class=\"name\">Navy 500<\u002Fspan><span class=\"meta\">#415A77<br>Focus ring<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"chip\" style=\"background:#D4AF37\"><\u002Fdiv><span class=\"name\">Gold<\u002Fspan><span class=\"meta\">#D4AF37<br>Accent only<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"chip\" style=\"background:#B9942C\"><\u002Fdiv><span class=\"name\">Gold pressed<\u002Fspan><span class=\"meta\">#B9942C<br>Hover / press<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<h3 style=\"margin-top:18px\">Surfaces, text and lines<\u002Fh3>\n<div class=\"grid\" style=\"grid-template-columns:repeat(5,1fr)\">\n<div class=\"sw\"><div class=\"chip\" style=\"background:#F7F3E9\"><\u002Fdiv><span class=\"name\">Page<\u002Fspan><span class=\"meta\">#F7F3E9<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"chip\" style=\"background:#FFFFFF\"><\u002Fdiv><span class=\"name\">Card<\u002Fspan><span class=\"meta\">#FFFFFF<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"chip\" style=\"background:#F1F1EE\"><\u002Fdiv><span class=\"name\">Inset<\u002Fspan><span class=\"meta\">#F1F1EE<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"chip\" style=\"background:#66717C\"><\u002Fdiv><span class=\"name\">Secondary text<\u002Fspan><span class=\"meta\">#66717C<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"chip\" style=\"background:#E5E5E2\"><\u002Fdiv><span class=\"name\">Border<\u002Fspan><span class=\"meta\">#E5E5E2<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<h3 style=\"margin-top:18px\">Functional states only<\u002Fh3>\n<div class=\"grid\" style=\"grid-template-columns:repeat(5,1fr)\">\n<div class=\"sw\"><div class=\"chip\" style=\"background:#B3261E\"><\u002Fdiv><span class=\"name\">Error<\u002Fspan><span class=\"meta\">#B3261E<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"chip\" style=\"background:#9A6B00\"><\u002Fdiv><span class=\"name\">Warning<\u002Fspan><span class=\"meta\">#9A6B00<\u002Fspan><\u002Fdiv>\n<div class=\"sw\"><div class=\"chip\" style=\"background:#1E6B4F\"><\u002Fdiv><span class=\"name\">Success<\u002Fspan><span class=\"meta\">#1E6B4F<\u002Fspan><\u002Fdiv>\n<div class=\"sw\" style=\"grid-column:span 2;justify-content:flex-end\"><span class=\"meta\">No colours beyond these. Gold never appears as a gradient, a metallic, a shadow, a card border, or a background — only as one small important detail per view.<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<span class=\"eyebrow\">02<\u002Fspan><h2>Typography<\u002Fh2><div class=\"rule\"><\u002Fdiv>\n<p class=\"meta\" style=\"margin-bottom:12px\">One family — Geist — across both products. Hierarchy comes from size and weight, nothing else.<\u002Fp>\n<table><thead><tr><th style=\"width:34%\">Specimen<\u002Fth><th>Role<\u002Fth><th style=\"width:22%\">Size / line<\u002Fth><th style=\"width:14%\">Weight<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td style=\"font-size:26px;line-height:32px;font-weight:600\">Your footage is ready<\u002Ftd><td class=\"m\">Screen headline<\u002Ftd><td class=\"m\">28 / 34<\u002Ftd><td class=\"m\">600<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-size:20px;line-height:26px;font-weight:600\">Saturday, 6:40am<\u002Ftd><td class=\"m\">Page title<\u002Ftd><td class=\"m\">22 / 28<\u002Ftd><td class=\"m\">600<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-size:16px;line-height:22px;font-weight:600\">Recent sessions<\u002Ftd><td class=\"m\">Section heading<\u002Ftd><td class=\"m\">17 / 24<\u002Ftd><td class=\"m\">600<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-size:14px;line-height:21px\">Four clips from Snapper Rocks, 6:40am.<\u002Ftd><td class=\"m\">Body<\u002Ftd><td class=\"m\">15 / 22<\u002Ftd><td class=\"m\">400<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-size:12.5px;line-height:18px;color:#66717C\">Uploaded 42 minutes after your session.<\u002Ftd><td class=\"m\">Secondary<\u002Ftd><td class=\"m\">13 / 18<\u002Ftd><td class=\"m\">400<\u002Ftd><\u002Ftr>\n<tr><td class=\"eyebrow\" style=\"font-size:10.5px\">This month<\u002Ftd><td class=\"m\">Label / eyebrow<\u002Ftd><td class=\"m\">11 / 14 · .08em<\u002Ftd><td class=\"m\">500<\u002Ftd><\u002Ftr>\n<tr><td style=\"font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase\">WaterGuards<\u002Ftd><td class=\"m\">Wordmark in app chrome<\u002Ftd><td class=\"m\">.18em tracking<\u002Ftd><td class=\"m\">600<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<\u002Fsection>\n\n<section class=\"sec\">\n<span class=\"eyebrow\">03<\u002Fspan><h2>Components<\u002Fh2><div class=\"rule\"><\u002Fdiv>\n<div class=\"tiles\">\n<div class=\"card\"><h3>Buttons<\u002Fh3>\n<div style=\"display:flex;gap:10px;flex-wrap:wrap\"><span class=\"btn\" style=\"background:#D4AF37;color:#101C2E\">Book a session<\u002Fspan><span class=\"btn\" style=\"background:#fff;color:#101C2E;border:1px solid #101C2E\">Cancel<\u002Fspan><span class=\"btn\" style=\"color:#101C2E\">Skip<\u002Fspan><\u002Fdiv>\n<p class=\"meta\" style=\"margin-top:10px\">Gold primary — one per screen. Rectangular, 10px radius. No pills, no gradients.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3>Status<\u002Fh3>\n<div style=\"display:flex;gap:8px;flex-wrap:wrap;align-items:center\"><span class=\"badge\" style=\"background:#D4AF37;color:#101C2E\">Ready<\u002Fspan><span class=\"badge\" style=\"background:#F1F1EE;color:#66717C;border:1px solid #E5E5E2\">Processing<\u002Fspan><span class=\"badge\" style=\"background:#101C2E;color:#fff\">Admin<\u002Fspan><span class=\"badge\" style=\"background:#FBEDEC;color:#B3261E;border:1px solid #F0D3D1\">Failed<\u002Fspan><\u002Fdiv>\n<p class=\"meta\" style=\"margin-top:10px\">At most one gold badge in view. Error styling is reserved for real failures.<\u002Fp><\u002Fdiv>\n<div class=\"card\"><h3>Cards<\u002Fh3>\n<div style=\"border:1px solid #E5E5E2;border-radius:12px;padding:12px;background:#fff\"><div style=\"font-size:18px;font-weight:600\">Tue 6:05am<\u002Fdiv><div class=\"meta\">Duranbah · 90 min<\u002Fdiv><\u002Fdiv>\n<p class=\"meta\" style=\"margin-top:10px\">White, 1px border, 12px radius, near-zero shadow. Never a card inside a card.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"background:#101C2E;border-color:#101C2E\"><h3 style=\"color:#fff\">Navy card<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:12px\">\n<div><div style=\"font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#A9B4C0\">Swell<\u002Fdiv><div style=\"font-size:18px;font-weight:600;color:#fff\">1.4m<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:#A9B4C0\">Wind<\u002Fdiv><div style=\"font-size:18px;font-weight:600;color:#fff\">8kt<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"meta\" style=\"margin-top:10px;color:#A9B4C0\">Used sparingly, for the one thing that matters most on a screen.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"card\" style=\"margin-top:14px\"><h3>Lists — the default way to show data<\u002Fh3>\n<div class=\"row\"><div><div style=\"font-weight:500\">Snapper Rocks<\u002Fdiv><div class=\"meta\">Sat 6:40am<\u002Fdiv><\u002Fdiv><span style=\"margin-left:auto;color:#66717C\">4 waves<\u002Fspan><\u002Fdiv>\n<div class=\"row\"><div><div style=\"font-weight:500\">Kirra<\u002Fdiv><div class=\"meta\">Thu 7:10am<\u002Fdiv><\u002Fdiv><span style=\"margin-left:auto;color:#66717C\">7 waves<\u002Fspan><\u002Fdiv>\n<div class=\"row\" style=\"border-bottom:none\"><div><div style=\"font-weight:500\">Duranbah<\u002Fdiv><div class=\"meta\">Tue 6:05am<\u002Fdiv><\u002Fdiv><span style=\"margin-left:auto\"><span class=\"badge\" style=\"background:#D4AF37;color:#101C2E\">New<\u002Fspan><\u002Fspan><\u002Fdiv>\n<p class=\"meta\" style=\"margin-top:10px\">Hairline rows, not a stack of cards. Numbers appear as label-and-value pairs with no container.<\u002Fp><\u002Fdiv>\n<div class=\"card\" style=\"margin-top:14px\"><h3>Navigation<\u002Fh3>\n<div style=\"display:flex;gap:16px;align-items:stretch\">\n<div style=\"flex:1;border-radius:10px;overflow:hidden;border:1px solid #E5E5E2\">\n<div style=\"background:#101C2E;padding:10px 12px;display:flex;align-items:center;gap:10px\"><img src=\"6abf1787-882d-44f8-90d7-f361656d2510\" alt=\"\" style=\"width:18px;height:18px;object-fit:contain\"><span style=\"color:#fff;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase\">WaterGuards<\u002Fspan><\u002Fdiv>\n<div style=\"background:#101C2E;display:grid;grid-template-columns:repeat(5,1fr);padding-top:2px\">\n<div style=\"border-top:2px solid #D4AF37;padding:8px 0;text-align:center;font-size:9px;color:#fff\">Home<\u002Fdiv>\n<div style=\"padding:8px 0;text-align:center;font-size:9px;color:#A9B4C0\">Footage<\u002Fdiv>\n<div style=\"padding:8px 0;text-align:center;font-size:9px;color:#A9B4C0\">Surf<\u002Fdiv>\n<div style=\"padding:8px 0;text-align:center;font-size:9px;color:#A9B4C0\">Schedule<\u002Fdiv>\n<div style=\"padding:8px 0;text-align:center;font-size:9px;color:#A9B4C0\">Profile<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"width:150px;background:#101C2E;border-radius:10px;padding:10px 0\">\n<div style=\"padding:6px 12px;font-size:11px;color:#A9B4C0\">Dashboard<\u002Fdiv>\n<div style=\"padding:6px 12px;font-size:11px;color:#fff;font-weight:500;border-left:2px solid #D4AF37;background:rgba(255,255,255,.06)\">Clients<\u002Fdiv>\n<div style=\"padding:6px 12px;font-size:11px;color:#A9B4C0\">Footage<\u002Fdiv>\n<div style=\"padding:6px 12px;font-size:11px;color:#A9B4C0\">Alerts<\u002Fdiv>\n<div style=\"padding:6px 12px;font-size:11px;color:#A9B4C0\">Settings<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<p class=\"meta\" style=\"margin-top:10px\">Client mobile: Home, Footage, Surf, Schedule, Profile. Admin desktop: Dashboard, Clients, Footage, Alerts, Settings. A 2px gold rule marks the active item — the only gold in the chrome.<\u002Fp><\u002Fdiv>\n<p class=\"meta\" style=\"margin-top:12px\">Full set, built and documented: <strong style=\"color:#101C2E;font-weight:500\">Button, IconButton, Card, Badge, Divider, Logo, Icon, Field, Input, Select, Checkbox, Radio, Switch, TopBar, TabBar, SideNav, Tabs, SectionHeader, ListRow, StatBlock, Dialog, Toast, EmptyState, FootageCard, VideoPlayer.<\u002Fstrong><\u002Fp>\n<\u002Fsection>\n\n<section class=\"sec\">\n<span class=\"eyebrow\">04<\u002Fspan><h2>Data &amp; numbers<\u002Fh2><div class=\"rule\"><\u002Fdiv>\n<div class=\"tiles\">\n<div><h3>How figures are shown<\u002Fh3>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n<div><div class=\"eyebrow\">Sessions<\u002Fdiv><div style=\"font-size:20px;font-weight:600\">12<\u002Fdiv><\u002Fdiv>\n<div><div class=\"eyebrow\">Waves<\u002Fdiv><div style=\"font-size:20px;font-weight:600\">128<\u002Fdiv><\u002Fdiv>\n<div><div class=\"eyebrow\">Longest ride<\u002Fdiv><div style=\"font-size:20px;font-weight:600\">18s<\u002Fdiv><div class=\"meta\">Kirra, 12 Aug<\u002Fdiv><\u002Fdiv>\n<div><div class=\"eyebrow\">Clips saved<\u002Fdiv><div style=\"font-size:20px;font-weight:600\">34<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"meta\" style=\"margin-top:10px\">Two to four per row, no tiles, no borders. Charts only when a trend genuinely can't be stated as a number.<\u002Fp><\u002Fdiv>\n<div><h3>Formats<\u002Fh3>\n<table><tbody>\n<tr><td>Surf height<\u002Ftd><td class=\"m\">3–4ft · 1.4m<\u002Ftd><\u002Ftr>\n<tr><td>Wind<\u002Ftd><td class=\"m\">8kt SW offshore<\u002Ftd><\u002Ftr>\n<tr><td>Water<\u002Ftd><td class=\"m\">21°C<\u002Ftd><\u002Ftr>\n<tr><td>Clip length<\u002Ftd><td class=\"m\">0:42<\u002Ftd><\u002Ftr>\n<tr><td>Time<\u002Ftd><td class=\"m\">6:40am<\u002Ftd><\u002Ftr>\n<tr><td>Date<\u002Ftd><td class=\"m\">Sat 12 Aug<\u002Ftd><\u002Ftr>\n<tr><td>Facts on one line<\u002Ftd><td class=\"m\">Mia Doyle · 6:44am · 0:38<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section class=\"sec\">\n<span class=\"eyebrow\">05<\u002Fspan><h2>Words<\u002Fh2><div class=\"rule\"><\u002Fdiv>\n<p class=\"meta\" style=\"margin-bottom:12px\">Calm, factual, useful — like a good surf report. Sentence case, second person to surfers, no emoji anywhere.<\u002Fp>\n<table><thead><tr><th style=\"width:50%\">We write<\u002Fth><th>Not<\u002Fth><\u002Ftr><\u002Fthead><tbody>\n<tr><td>Your footage is ready<\u002Ftd><td class=\"m\">Your epic session awaits!<\u002Ftd><\u002Ftr>\n<tr><td>Four clips from Snapper Rocks, 6:40am.<\u002Ftd><td class=\"m\">We've curated the highlights of your incredible surf.<\u002Ftd><\u002Ftr>\n<tr><td>Camera 2 offline — Kirra tower · 12 minutes ago<\u002Ftd><td class=\"m\">Uh oh! Something went wrong.<\u002Ftd><\u002Ftr>\n<tr><td>No footage yet. Clips appear here within an hour of your session.<\u002Ftd><td class=\"m\">Nothing to see here!<\u002Ftd><\u002Ftr>\n<tr><td>Book a session<\u002Ftd><td class=\"m\">Get started now →<\u002Ftd><\u002Ftr>\n<\u002Ftbody><\u002Ftable>\n<\u002Fsection>\n\n<section class=\"sec\">\n<span class=\"eyebrow\">06<\u002Fspan><h2>Logo, imagery and motion<\u002Fh2><div class=\"rule\"><\u002Fdiv>\n<div class=\"tiles\">\n<div><h3>Logo<\u002Fh3>\n<div style=\"display:flex;gap:12px\">\n<div style=\"flex:1;background:#101C2E;border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px\"><img src=\"6abf1787-882d-44f8-90d7-f361656d2510\" alt=\"\" style=\"width:52px;height:52px;object-fit:contain\"><span style=\"color:#fff;font-size:9.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase\">WaterGuards<\u002Fspan><\u002Fdiv>\n<div style=\"flex:1;background:#fff;border:1px solid #E5E5E2;border-radius:10px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:10px;justify-content:center\"><span style=\"color:#101C2E;font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase\">WaterGuards<\u002Fspan><span class=\"meta\" style=\"text-align:center\">Navy wordmark on white or ivory<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<p class=\"meta\" style=\"margin-top:10px\">Two treatments only: gold mark on navy, or navy wordmark on light. Flat inside the product — the metallic, embossed and script versions stay in brand material.<\u002Fp><\u002Fdiv>\n<div><h3>Imagery &amp; motion<\u002Fh3>\n<p class=\"meta\">Surf footage is the strongest visual element on every screen: 16:9, 10px radius, natural colour, no filters or overlays. No background graphics, patterns, illustrations or decorative waves anywhere.<\u002Fp>\n<p class=\"meta\" style=\"margin-top:8px\">Motion is 120–180ms on colour and opacity only. Nothing bounces, nothing floats, nothing animates that the user didn't cause.<\u002Fp>\n<div class=\"hair\"><\u002Fdiv>\n<p class=\"meta\"><strong style=\"color:#101C2E;font-weight:500\">Still needed from you:<\u002Fstrong> flat SVG logo files, and 3–5 real surf stills so the footage screens show the real thing.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<div class=\"hair\" style=\"margin-top:30px\"><\u002Fdiv>\n<p class=\"meta\">WaterGuards design system · colours, type, components, content rules · prepared August 2026<\u002Fp>\n\n<\u002Fdoc-page>\n<script src=\"fd65d549-b22c-4b8b-896a-42dc73f2b065\"><\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
